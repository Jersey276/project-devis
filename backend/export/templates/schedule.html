<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Échéancier {{.ScheduleName}}</title>
    <style>
      :root {
        --ink: #0b1321;
        --muted: #5b6470;
        --line: #d8dee9;
        --bg-soft: #f4f7fb;
        --accent: #0b7a75;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 28px;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        color: var(--ink);
      }

      h1 {
        margin: 0;
        font-size: 24px;
      }

      .subtitle {
        margin-top: 6px;
        color: var(--muted);
        font-size: 13px;
      }

      .meta {
        margin-top: 16px;
        display: grid;
        grid-template-columns: repeat(4, minmax(120px, 1fr));
        gap: 10px;
      }

      .meta-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
      }

      .meta-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }

      .meta-value {
        margin-top: 6px;
        font-size: 14px;
        font-weight: 600;
      }

      h2 {
        margin: 22px 0 10px;
        font-size: 16px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border: 1px solid var(--line);
        padding: 8px 10px;
        font-size: 12px;
      }

      th {
        background: var(--bg-soft);
        text-align: left;
      }

      .num {
        text-align: right;
        white-space: nowrap;
      }

      .total-row td {
        font-weight: 700;
      }

      .chip {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        color: white;
        background: var(--accent);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Échéancier {{.ShortID}}</h1>
      <p class="subtitle">{{.ScheduleName}}</p>
    </header>

    <section class="meta">
      <article class="meta-card">
        <div class="meta-label">Statut</div>
        <div class="meta-value"><span class="chip">{{.Status}}</span></div>
      </article>
      <article class="meta-card">
        <div class="meta-label">Début</div>
        <div class="meta-value">{{.StartMonth}}</div>
      </article>
      <article class="meta-card">
        <div class="meta-label">Durée</div>
        <div class="meta-value">{{.DurationMonths}} mois</div>
      </article>
      <article class="meta-card">
        <div class="meta-label">Devis lié</div>
        <div class="meta-value">{{.QuoteLabel}}</div>
      </article>
    </section>

    <h2>Résumé mensuel</h2>
    <table>
      <thead>
        <tr>
          <th>Mois</th>
          <th class="num">Montant planifié</th>
          <th class="num">Cumul</th>
        </tr>
      </thead>
      <tbody>
        {{range .MonthlyTotals}}
        <tr>
          <td>{{.Label}}</td>
          <td class="num">{{.Amount}}</td>
          <td class="num">{{.Cumulated}}</td>
        </tr>
        {{end}}
        <tr class="total-row">
          <td>Total</td>
          <td class="num" colspan="2">{{.PlannedTotal}}</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
